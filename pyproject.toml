[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openscout-agent"
version = "0.1.0"
description = "An AI-powered academic systematic literature review agent with arXiv, Semantic Scholar, CrossRef, and PDF extraction tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "pyfiglet>=1.0",
    "arxiv",
    "pymupdf",
    "ddgs",
    "requests",
]

[project.scripts]
openscout-agent = "agent.__main__:main"

[tool.setuptools.packages.find]
include = ["agent*"]
